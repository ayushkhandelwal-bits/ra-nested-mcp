[project]
name = "ra-nested-mcp"
version = "0.1.0"
description = "Nested MCP system for telecom Revenue Assurance: local vector store + Claude-driven orchestrator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp",
    "groq",
    "sentence-transformers",
    "numpy",
    "pydantic-settings",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pandas",
    "pyarrow",
    "scipy",
    "statsmodels",
]

[project.scripts]
mcp1 = "mcp1_vectorstore.server:main"
mcp2 = "mcp2_orchestrator.server:main"
mcp3 = "mcp3_analytics.server:main"
mcp4 = "mcp4_forecasting.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp1_vectorstore", "src/mcp2_orchestrator", "src/mcp3_analytics", "src/mcp4_forecasting"]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "ty>=0.0.18",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
